name: PUB release and competency insight validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate-insight:
    name: Validate competency insight contract
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Run archived insight contract tests
        run: pnpm exec node --test .migration-backup/tests/competency-insight-contract.test.mjs

      - name: Run insight publication and diagnostic tests
        run: pnpm exec node --test .migration-backup/tests/publish-competency-insight.test.mjs .migration-backup/tests/verify-competency-insight.test.mjs .migration-backup/tests/subprocess-diagnostics.test.mjs

  validate-active-frontend:
    name: Validate active PUB and Ruang Simpan release
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck workspace packages
        run: pnpm run typecheck

      - name: Run active PUB unit tests
        env:
          VITE_SUPABASE_URL: https://ci-playwright.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-publishable-key
        run: pnpm --filter @workspace/pub-aspekindo run test

      - name: Build production bundle with Ruang Simpan
        env:
          PORT: "4179"
          BASE_PATH: "/"
          VITE_SUPABASE_URL: https://ci-playwright.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-publishable-key
        run: pnpm --filter @workspace/pub-aspekindo run build:release

      - name: Install Chromium for routing smoke test
        run: pnpm --filter @workspace/pub-aspekindo exec playwright install --with-deps chromium

      - name: Smoke test public routes and member assessment through results
        run: pnpm --filter @workspace/pub-aspekindo run test:routing

      - name: Install local native media fixture encoder
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Test native video network recovery
        run: pnpm --filter @workspace/pub-aspekindo run test:media

      - name: Upload native media evidence on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: native-media-results
          path: artifacts/pub-aspekindo/test-results/native-media/
          if-no-files-found: ignore

  validate-api-server:
    name: Validate shared API and knowledge base
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace library types
        run: pnpm run typecheck:libs

      - name: Typecheck shared API
        run: pnpm --filter @workspace/api-server run typecheck

      - name: Build production API artifact
        env:
          NODE_ENV: production
        run: pnpm --filter @workspace/api-server run build

      - name: Test API, knowledge base and source synchronization
        run: pnpm --filter @workspace/api-server run test
