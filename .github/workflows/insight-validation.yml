name: Competency insight validation

on:
  pull_request:

permissions:
  contents: read

jobs:
  validate-insight:
    name: Validate competency insight
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run the standard insight validation
        run: npm run test:insight:validate

  validate-frontend:
    name: Validate frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck frontend
        run: npm run typecheck

      - name: Lint frontend
        run: npm run lint

      - name: Build frontend
        run: npm run build

      - name: Run frontend routing smoke test
        env:
          VITE_SUPABASE_URL: https://ci-placeholder.invalid
          VITE_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-publishable-key
        run: npm run test:routing
